name: VM6 Mergify v25 scope gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      scopes: ${{ steps.scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize trusted base config
        run: git show origin/main:.mergify.yml > "$RUNNER_TEMP/trusted-mergify.yml"
      - name: Detect scopes with official Mergify Action default CLI
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          mergify_config_path: ${{ runner.temp }}/trusted-mergify.yml

  critical:
    needs: detect
    if: fromJSON(needs.detect.outputs.scopes).critical == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security-sensitive critical test
        run: grep -qx VM6_SECURITY_GUARD_20260913 critical/guard.txt

  scope-gate:
    if: always()
    needs: [detect, critical]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required gate
        run: |
          test "${{ needs.detect.result }}" = "success"
          test "${{ needs.critical.result }}" != "failure"
